<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Placar Brasileirão</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <span class="logo" aria-hidden="true"></span>
      <strong>Placar Brasileirão</strong>
      <span class="grow"></span>
      <span id="updated" class="updated"></span>
      <button id="refresh" class="icon-btn" title="Atualizar agora" aria-label="Atualizar agora"></button>
    </header>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="jogos">Jogos</button>
      <button role="tab" data-tab="times">Times</button>
      <button role="tab" data-tab="config">Config</button>
    </nav>
    <main id="view"></main>
    <div id="toast" hidden></div>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
